<title id="title">Hive introduction: page 1, Welcome</title>
<desc id="desc">Static design proposal. Give your work a home. Six numbered pages surround a broad hexagon on desktop; the narrow version is a rectangular sheet. The demo UI is a schematic placeholder, not a live screenshot. One hive is one task, with a shared work record.</desc>
