<text x="46" y="460" fill="#f3f1e8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start">Which cover should</text>
<text x="46" y="487" fill="#f3f1e8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="start">the guide use?</text>
