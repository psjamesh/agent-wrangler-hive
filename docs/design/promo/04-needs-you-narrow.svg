<polygon points="53.0,44.0 46.0,56.1 32.0,56.1 25.0,44.0 32.0,31.9 46.0,31.9" fill="#111a1e" stroke="#efbd61" stroke-width="2"/>
<text x="63" y="49" fill="#f3f1e8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" text-anchor="start">Introducing Hive</text>
<text x="346" y="50" fill="#b4c1bb" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" text-anchor="middle">×</text>
<text x="30" y="96" fill="#efbd61" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="start">PAGE 4 OF 6</text>
<text x="30" y="129" fill="#b4c1bb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" text-anchor="start">Jump to page</text>
<rect x="30" y="140" width="330" height="43" rx="7" fill="#111a1e" stroke="#435149"/>
<text x="44" y="168" fill="#f3f1e8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start">4 · Needs you</text>
<text x="337" y="168" fill="#b4c1bb" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" text-anchor="start">⌄</text>
<text x="30" y="231" fill="#f3f1e8" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="650" text-anchor="start">Step in where</text>
<text x="30" y="267" fill="#f3f1e8" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="650" text-anchor="start">it matters.</text>
<text x="30" y="306" fill="#b4c1bb" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start">Open a request, read the choices</text>
<text x="30" y="331" fill="#b4c1bb" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start">and send your answer. The queen</text>
<text x="30" y="356" fill="#b4c1bb" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" text-anchor="start">brings the decisions that need you.</text>
<rect x="30" y="387" width="330" height="188" rx="10" fill="#111a1e" stroke="#435149"/>
<rect x="46" y="402" width="142" height="28" rx="14" fill="#f1c574" stroke="#efbd61"/>
