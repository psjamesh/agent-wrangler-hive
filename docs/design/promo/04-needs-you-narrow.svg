<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Hive introduction: page 4, Needs you, narrow layout</title>
<desc id="desc">Static design proposal. Step in where it matters. Six numbered pages surround a broad hexagon on desktop; the narrow version is a rectangular sheet. The demo UI is a schematic placeholder, not a live screenshot. Answer request settles it; a conversation reply alone does not.</desc>
